# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# ========== 导航栏 ==========
nav:
  logo:
  display_title: true
  fixed: true
  darkmode: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# ========== 代码块 ==========
highlight_theme: mac light
highlight_copy: true
highlight_lang: true
highlight_shrink: false
highlight_height_limit: 400
code_word_wrap: true

# ========== 社交图标 ==========
social:
  fab fa-github: https://github.com/ansoco || Github

# ========== 首页 ==========
# 主页顶部大图 - 克制的研究笔记氛围
index_img:
default_top_img: radial-gradient(circle at 18% 18%, rgba(219, 234, 240, 0.9) 0%, rgba(219, 234, 240, 0) 34%), radial-gradient(circle at 82% 24%, rgba(185, 205, 211, 0.75) 0%, rgba(185, 205, 211, 0) 32%), linear-gradient(135deg, #eef1ed 0%, #dfe9eb 48%, #cddfe2 100%)
post_default_top_img: radial-gradient(circle at 18% 18%, rgba(219, 234, 240, 0.9) 0%, rgba(219, 234, 240, 0) 34%), radial-gradient(circle at 82% 24%, rgba(185, 205, 211, 0.75) 0%, rgba(185, 205, 211, 0) 32%), linear-gradient(135deg, #eef1ed 0%, #dfe9eb 48%, #cddfe2 100%)

# 首页文章卡片样式
index_layout: 3
index_post_content:
  method: 2
  length: 300

# ========== 文章页 ==========
post_meta:
  page:
    date_type: created
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: YYYY-MM-DD
    categories: true
    tags: true
    label: true

# 文章版权信息
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 目录 TOC
toc:
  post: true
  page: false
  number: false
  expand: false
  style_simple: false
  scroll_percent: false

# ========== 页脚 ==========
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

# ========== 侧边栏 ==========
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: '关于 RL、LLM Training 与 Agentic AI 的研究笔记'
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/ansoco
  card_announcement:
    enable: true
    content: '记录模型训练、强化学习和 agentic systems 中值得反复咀嚼的问题。'
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: false
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: false
    limit: 20
    color: false
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: false
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:

# ========== 右下角按钮 ==========
readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ========== 字体 ==========
font:
  global-font-size: "16px"
  code-font-size: "14px"
  font-family: "-apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
  code-font-family: "'JetBrains Mono', 'Fira Code', 'SF Mono', Monaco, monospace"

# ========== 美化 ==========
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#3f6f8f'

# 圆角
hr_icon:
  enable: true
  icon: '\f21e'
  icon-top:

# 复制设置
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# ========== 分析与搜索 ==========
local_search:
  enable: false

# ========== 图片 ==========
photofigcaption: false
fancybox: true

# ========== 通知 ==========
snackbar:
  enable: true
  position: bottom-left
  bg_light: '#3f6f8f'
  bg_dark: '#1f3747'

# ========== 自定义CSS注入（玻璃态效果） ==========
inject:
  head:
    - <link rel="stylesheet" href="/blog/css/custom.css?v=theme1">
  bottom:
    - <script src="/blog/js/toc-smart.js?v=theme1"></script>
